# Anthropic first-party API list prices in USD per million tokens (checked 2026-10-16).
# Verify against https://platform.claude.com/docs/en/about-claude/pricing before relying on totals.
#
# cache_read defaults to 0.1x input when omitted. Cache writes are priced as a multiple of input:
# 1.25x for the 5-minute TTL and 2x for the 1-hour TTL.
# fast_multiplier applies to every token kind when a response reports `speed: fast`.
# long_context switches to other prices once a request's prompt tokens exceed threshold_tokens.
# context_window (tokens) is not a price; reports use it to show how full the context got.
# Model ids are matched after stripping a date suffix (claude-haiku-4-5-20251001 -> claude-haiku-4-5).

cache_write_5m_multiplier: 1.25
cache_write_1h_multiplier: 2.0

models:
  claude-fable-5-1:   { input: 10.00, output: 50.00, cache_read: 0.25, context_window: 1000000 }
  claude-mythos-5-1:  { input: 10.00, output: 50.00, cache_read: 0.25, context_window: 1000000 }
  claude-fable-5:     { input: 10.00, output: 50.00, context_window: 1000000 }
  claude-opus-5-5:    { input: 4.00, output: 20.00, cache_read: 0.20, fast_multiplier: 2.0, context_window: 1000000 }
  claude-opus-5:      { input: 5.00, output: 25.00, fast_multiplier: 2.0, context_window: 1000000 }
  claude-opus-4-8:    { input: 5.00, output: 25.00, context_window: 1000000 }
  claude-opus-4-7:    { input: 5.00, output: 25.00, context_window: 1000000 }
  claude-opus-4-6:    { input: 5.00, output: 25.00, context_window: 1000000 }
  claude-sonnet-5-5:  { input: 2.00, output: 10.00, cache_read: 0.20, context_window: 1000000 }
  claude-sonnet-5:    { input: 2.00, output: 10.00, context_window: 1000000 }
  claude-sonnet-4-6:  { input: 3.00, output: 15.00, context_window: 1000000 }
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    context_window: 1000000
    long_context:
      threshold_tokens: 100000
      input: 0.50
      output: 2.50
  claude-haiku-4-5:   { input: 1.00, output: 5.00, context_window: 200000 }
