[project]
name = "claude-lens"
version = "0.1.0"
description = "Cost, cache and efficiency analytics for Claude: Claude Code transcripts and API traffic"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Radoslaw Krzywiecki" }]
requires-python = ">=3.12"
keywords = ["claude", "llm", "observability", "cost", "prompt-caching", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
claude-lens = "claude_lens.entry:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
# A new warning (a deprecation in a dependency, an unclosed resource) fails the suite.
filterwarnings = ["error"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["claude_lens"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
